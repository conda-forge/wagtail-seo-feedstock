# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: wagtail-seo
  version: 3.2.0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/wagtail_seo-${{ version }}.tar.gz
  sha256: 24accbff5915cb762a761d80ee9e15f5f2617810c73f1a60b851b1cbec7a6946

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=65.0
    - pip
  run:
    - python >=${{ python_min }},<4.0
    - wagtail >=4.0,<9.0
tests:
  - python:
      imports:
        - wagtailseo
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  summary: Search engine and social media optimization for Wagtail.
  homepage: https://github.com/coderedcorp/wagtail-seo
  license: BSD-3-Clause
  license_file: LICENSE.txt
  repository: https://github.com/coderedcorp/wagtail-seo

extra:
  recipe-maintainers:
    - rxm7706
